<script>
    let pyodide = null;
    let pycute = null;
    let globals = null;

    function visualize_layout_2d(canvas_id, layout) {
        console.log("Visualizing layout.")
        get_color = (i,j) => 'lightgrey';

        let canvas = document.getElementById(canvas_id);
        let ctx = canvas.getContext('2d');
        let width = canvas.width;
        let height = canvas.height;

        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = 'white';

        if (layout.shape.toJs().length != 2) {
            console.error("Only 2D layouts are supported in this visualization.");
            return;
        }

        let vars = pyodide.toPy({ l: layout })
        let M = pyodide.runPython('pycute.Layout(l.shape[0]).size()', {"locals": vars, "globals": globals});
        let N = pyodide.runPython('pycute.Layout(l.shape[1]).size()', {"locals": vars, "globals": globals});

        // determine a cell size based on canvas size and layout dimensions
        let cell_size = Math.min(width / N, height / M, 60)

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `${cell_size / 4}px Arial`;
        let offset_x = (width - N * cell_size) / 2;
        let offset_y = (height - M * cell_size) / 2;

        for (let i = 0; i < M; i++) {
            for (let j = 0; j < N; j++) {
                let cell_value = layout(i, j);
                ctx.fillStyle = get_color([i,j]);
                ctx.fillRect(offset_x + j * cell_size, offset_y + i * cell_size, cell_size, cell_size);
                ctx.strokeStyle = 'black';
                ctx.strokeRect(offset_x + j * cell_size, offset_y + i * cell_size, cell_size, cell_size);

                ctx.fillStyle = 'black';
                ctx.fillText(cell_value, offset_x + (j + 0.5) * cell_size, offset_y + (i + 0.5) * cell_size);
            }
        }
    }

    function visualize_layout_tv(canvas_id, layout_tv, tile_mn) {
        let vars = pyodide.toPy({ l: tile_mn})
        let M = pyodide.runPython('pycute.Layout(l.shape[0]).size()', {"locals": vars, "globals": globals});
        let N = pyodide.runPython('pycute.Layout(l.shape[1]).size()', {"locals": vars, "globals": globals});

        let vars = pyodide.toPy({ l: layout_tv})
        let tid = pyodide.runPython('pycute.Layout(l.shape[0]).size()', {"locals": vars, "globals": globals});
        let vid = pyodide.runPython('pycute.Layout(l.shape[1]).size()', {"locals": vars, "globals": globals});

    async function main() {
        setStatus("Loading Pyodide...");
        pyodide = await loadPyodide();
        setStatus("Loading pycute...");
        await loadPycute();
        setStatus("Ready!");
    }

    const package_files = {
        "__init__.py": "https://raw.githubusercontent.com/NVIDIA/cutlass/refs/heads/main/python/pycute/__init__.py",
        "typing.py": "https://raw.githubusercontent.com/NVIDIA/cutlass/refs/heads/main/python/pycute/typing.py",
        "layout.py": "https://raw.githubusercontent.com/NVIDIA/cutlass/refs/heads/main/python/pycute/layout.py",
        "swizzle.py": "https://raw.githubusercontent.com/NVIDIA/cutlass/refs/heads/main/python/pycute/swizzle.py",
        "int_tuple.py": "https://raw.githubusercontent.com/NVIDIA/cutlass/refs/heads/main/python/pycute/int_tuple.py",
    };

    function setStatus(text) {
        let canvas = document.getElementById("layout_viz");
        let ctx = canvas.getContext('2d');
        ctx.font = "50px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "white";
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);
    }

    async function fetchPackageFiles() {
        const sources = {};
        const fetchPromises = [];

        for (const [filename, url] of Object.entries(package_files)) {
            fetchPromises.push(
                fetch(url)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`Failed to fetch ${filename}: ${response.status}`);
                        }
                        return response.text();
                    })
                    .then(content => {
                        sources[filename] = content;
                        console.log(`Fetched ${filename} (${content.length} chars)`);
                    })
                    .catch(error => {
                        console.log(`Error fetching ${filename}: ${error.message}`);
                        throw error;
                    })
                );
            }

            await Promise.all(fetchPromises);
            return sources;
        }

    async function loadPycute() {
        const sources = await fetchPackageFiles();
        pyodide.runPython(`
import sys
import types

# Package configuration
PACKAGE_NAME = "pycute"
package_sources = ${JSON.stringify(sources)}

package_module = types.ModuleType(PACKAGE_NAME)
package_module.__path__ = []  # Required for it to be treated as a package
package_module.__file__ = f"{PACKAGE_NAME}/__init__.py"
sys.modules[PACKAGE_NAME] = package_module

for filename in package_sources.keys():
    if filename == "__init__.py":
        continue

    module_name = f"{PACKAGE_NAME}.{filename.replace('.py', '')}"
    module = types.ModuleType(module_name)
    module.__file__ = f"{PACKAGE_NAME}/{filename}"
    sys.modules[module_name] = module
    print(f"Created module: {module_name}")

execution_order = ["typing.py", "int_tuple.py", "layout.py", "swizzle.py", "__init__.py"]

for filename in execution_order:
    if filename not in package_sources:
        continue

    source_code = package_sources[filename]

    if filename == "__init__.py":
        # The __init__.py runs inside the main package module
        module_to_populate = sys.modules[PACKAGE_NAME]
        module_name = PACKAGE_NAME
    else:
        # Other files run inside their own submodule
        module_name = f"{PACKAGE_NAME}.{filename.replace('.py', '')}"
        module_to_populate = sys.modules[module_name]

    # Set the package context for the execution
    module_to_populate.__package__ = PACKAGE_NAME
    module_to_populate.__name__ = module_name

    print(f"Executing {filename} in context of {module_name}")

    try:
        exec(source_code, module_to_populate.__dict__)
    except Exception as e:
        print(f"Error executing {filename}: {e}")
        import traceback
        traceback.print_exc()

def bw_color_map(coord):
    global layout
    idx = layout(*coord)
    shades =  ["#FFFFFF", "#999999", "#CCCCCC", "#666666","#E6E6E6", "#808080","#B3B3B3","#4D4D4D"]
    return shades[idx % len(shades)]

def tv_color_map(coord):
    color_map = ["#AFAFFF","#AFFFAF","#FFFFAF","#FFAFAF","#D2D2FF","#D2FFD2","#FFFFD2","#FFD2D2"]
    return color_map[coord[0] % 8]

def split_layout_shape(layout):
    return pycute.Layout(layout.shape[0]), pycute.Layout(layout.shape[1])

import pycute
`);
    globals = pyodide.globals;
    pycute = pyodide.pyimport("pycute");
    }

</script>
<script>
            document.addEventListener("DOMContentLoaded", async () => {
                let canvas_id = "layout_viz";

                let load_future = main();

                const editor = ace.edit("editor");
                editor.setTheme("ace/theme/monokai");
                editor.session.setMode("ace/mode/python");
                editor.setValue(`
# Will auto update on change
layout = pycute.Layout(((2,2),4), ((1,2), 8))
visualize2d(layout)
                `, -1);
                let update = async () => {
                    await load_future
                    const code = editor.getValue();
                    try {
                        pyodide.globals.set("visualize2d", visualize_layout_2d.bind(null, canvas_id));
                        await pyodide.runPython(code);
                    } catch (error) {
                        console.error("Error executing Python code:", error);
                    }
                } 
                editor.session.on('change', update);

                update();
            });
</script>
